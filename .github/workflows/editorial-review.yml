name: Editorial review

# Runs an LLM pass over content PRs (opened from drafts -> main) for
# grammar, sentence structure, and technical-accuracy suggestions. Posts
# inline review comments only — never auto-commits changes. The owner
# reviews and applies suggestions manually before merging.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.head.ref == 'drafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run editorial review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review the diff on this pull request as a copy editor, not a code
            reviewer. The changed files are markdown blog posts and project
            write-ups (in blogs/ and projects/), not application code.

            For each file changed, check for:
            - Grammar and sentence-structure issues
            - Awkward phrasing or unclear sentences
            - Technical inaccuracies or claims that look wrong/inconsistent
              with the rest of the post

            Post your findings as inline PR review comments on the specific
            lines you have suggestions for, using
            mcp__github_inline_comment__create_inline_comment. Do not commit
            or push any changes yourself — only leave suggestions for the
            author to apply manually. If you find nothing worth flagging in
            a file, say nothing about that file rather than commenting just
            to comment. Finish with one short top-level PR comment
            summarizing how many suggestions you left, or that you found
            nothing to flag.
