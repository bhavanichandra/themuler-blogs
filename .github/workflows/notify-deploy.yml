name: Notify bytes-of-me deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "blogs/**"
      - "projects/**"

jobs:
  trigger-deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -sf -X POST "$VERCEL_DEPLOY_HOOK_URL"

  discord-thread-for-new-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Find changed blog files
        id: changed
        run: |
          changed=$(git diff --diff-filter=AM --name-only "${{ github.event.before }}" "${{ github.event.after }}" -- 'blogs/**')
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Notify Discord for newly comment-enabled live posts
        if: steps.changed.outputs.paths != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
          CHANGED_PATHS: ${{ steps.changed.outputs.paths }}
        run: |
          IFS=$'\n' read -rd '' -a paths <<< "$CHANGED_PATHS" || true
          node scripts/discord-notify.mjs "$DISCORD_WEBHOOK_URL" "$BEFORE_SHA" "${paths[@]}"
