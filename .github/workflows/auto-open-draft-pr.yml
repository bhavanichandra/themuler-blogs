name: Open drafts PR

# themuler-cms commits content edits directly to `drafts`. Once a day, in the
# evening, this checks whether drafts has anything main doesn't and opens a PR
# if so. To publish sooner, run this workflow by hand (Actions tab -> Open
# drafts PR -> Run workflow). See docs/research/cms-batch-publish-workflow.md
# in bytes-of-me for why.

on:
  schedule:
    # 13:30 UTC = 19:00 IST. GitHub may start scheduled runs a few minutes late.
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check drafts has real content changes vs main
        id: diff
        run: |
          git fetch origin main drafts
          if git diff --quiet origin/main origin/drafts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if none exists yet
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DRAFTS_PR_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head drafts --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head drafts \
              --title "Publish: pending content changes" \
              --body "Auto-opened by the drafts-publish workflow. Review the editorial suggestions below, then merge to publish."
          else
            echo "PR #$existing already open for drafts -> main, new commits will show up there automatically."
          fi
